{% if user.is_authenticated %}

<nav class="fixed top-0 left-0 z-50 flex w-full items-center justify-between px-6 py-4 text-gray-100">

    <!-- Brand -->
    <div>
        <a
            href="{% url 'filme:homefilmes' %}"
            class="text-2xl font-bold tracking-wider text-red-600 no-underline hover:text-red-500 md:text-3xl"
        >
            DEVFLIX
        </a>
    </div>

    <!-- Navigation -->
    <div class="flex items-center gap-3">

        <!-- Search -->
        <form
            method="get"
            action="{% url 'filme:pesquisafilme' %}"
            class="hidden items-center md:flex"
        >
            <input
                type="text"
                name="query"
                value="{{ request.GET.query|default:'' }}"
                placeholder="Search titles..."
                aria-label="Search titles"
                class="rounded-md bg-white px-3 py-2 text-sm text-black outline-none focus:ring-2 focus:ring-red-600"
            >
        </form>

        <!-- Profile -->
        <a
            href="{% url 'filme:editarperfil' user.pk %}"
            class="rounded-md bg-gray-800 px-4 py-2 text-sm font-medium text-white no-underline transition hover:bg-gray-700"
        >
            Profile
        </a>

        <!-- Logout -->
        <form
            method="post"
            action="{% url 'filme:logout' %}"
            class="m-0"
        >
            {% csrf_token %}

            <button
                type="submit"
                class="rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-700"
            >
                Sign Out
            </button>
        </form>

    </div>

</nav>

{% endif %}
